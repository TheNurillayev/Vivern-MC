<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Vivern MC - Admin Panel</title>
  <link rel="stylesheet" href="/static/css/app.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    /* Admin Navigation Buttons - Horizontal Cards stacked vertically */
    .admin-nav-cards {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 22px;
    }
    .admin-nav-card {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 18px;
      border-radius: 14px;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      cursor: pointer;
      text-align: left;
      transition: all 0.25s ease;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
    }
    .admin-nav-card:hover {
      background: var(--bg-card-hover);
      transform: translateY(-1px);
    }
    .admin-nav-card.active {
      border-color: var(--accent-gold);
      background: linear-gradient(135deg, rgba(245, 158, 11, 0.14), rgba(139, 92, 246, 0.12));
      box-shadow: 0 4px 20px rgba(245, 158, 11, 0.15);
    }
    .admin-nav-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .admin-nav-icon {
      font-size: 1.6rem;
      width: 46px;
      height: 46px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.05);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .admin-nav-title {
      font-weight: 700;
      font-size: 1.05rem;
      color: var(--text-main);
    }
    .admin-nav-desc {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 3px;
    }
    .admin-nav-arrow {
      font-size: 1.1rem;
      color: var(--text-muted);
      transition: all 0.2s ease;
      font-weight: bold;
    }
    .admin-nav-card.active .admin-nav-arrow {
      color: var(--accent-gold);
      transform: translateX(3px);
    }

    /* Category & Track items */
    .category-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 16px;
    }
    .track-item {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 12px;
      margin-top: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .track-active {
      border-color: var(--accent-emerald);
      background: rgba(16, 185, 129, 0.05);
    }
    .track-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
    }
    .badge-active {
      background: var(--accent-emerald);
      color: #064e3b;
      padding: 2px 8px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.7rem;
    }
    .badge-inactive {
      background: rgba(255, 255, 255, 0.1);
      color: var(--text-muted);
      padding: 2px 8px;
      border-radius: 8px;
      font-size: 0.7rem;
    }
    audio {
      width: 100%;
      height: 32px;
      border-radius: 6px;
    }
    .action-btn-row {
      display: flex;
      gap: 8px;
    }
    .btn-sm {
      padding: 6px 12px;
      font-size: 0.8rem;
      border-radius: 8px;
      cursor: pointer;
      border: none;
      font-weight: 600;
      transition: opacity 0.2s;
    }
    .btn-sm:hover {
      opacity: 0.9;
    }
    .btn-activate {
      background: var(--accent-blue);
      color: white;
    }
    .btn-delete {
      background: rgba(239, 68, 68, 0.2);
      color: var(--danger-color);
    }

    /* User Management Search and Cards */
    .user-search-wrapper {
      position: relative;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
    }
    .user-search-icon {
      position: absolute;
      left: 14px;
      font-size: 1.1rem;
      color: var(--text-muted);
      pointer-events: none;
    }
    .user-search-input {
      width: 100%;
      padding: 12px 38px 12px 42px;
      border-radius: 12px;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      font-size: 0.9rem;
      outline: none;
      transition: all 0.2s;
    }
    .user-search-input:focus {
      border-color: var(--accent-gold);
      box-shadow: 0 0 12px rgba(245, 158, 11, 0.15);
    }
    .user-search-clear {
      position: absolute;
      right: 12px;
      background: rgba(255, 255, 255, 0.1);
      border: none;
      color: var(--text-muted);
      border-radius: 50%;
      width: 22px;
      height: 22px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
    }

    .user-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      transition: border-color 0.2s;
    }
    .user-card:hover {
      border-color: rgba(255, 255, 255, 0.15);
    }
    .user-card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
    }
    .user-profile-header {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .user-avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 1.15rem;
      color: #fff;
      flex-shrink: 0;
    }
    .user-meta-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      background: rgba(255, 255, 255, 0.02);
      border-radius: 10px;
      padding: 12px;
      border: 1px solid rgba(255, 255, 255, 0.04);
    }
    .user-meta-cell {
      display: flex;
      flex-direction: column;
    }
    .user-meta-label {
      font-size: 0.72rem;
      color: var(--text-muted);
    }
    .user-meta-val {
      font-size: 0.88rem;
      font-weight: 600;
      margin-top: 2px;
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <div class="brand-icon">⚙️</div>
      <div>
        <div class="brand-title">ADMIN PANEL</div>
        <div style="font-size: 0.72rem; color: var(--text-muted);" id="admin-subtitle">Boshqaruv Markazi</div>
      </div>
    </div>
    <a href="/index.html" class="badge-tag" style="text-decoration:none; background: rgba(255,255,255,0.1); color: var(--text-main);">
      ← Mini App
    </a>
  </header>

  <main>
    <!-- Access Denied Card (default visible until verified) -->
    <div id="unauthorized-card" class="card hidden" style="border-color: var(--danger-color); text-align: center;">
      <div style="font-size: 2.5rem; margin-bottom: 10px;">⛔</div>
      <h2 style="color: var(--danger-color); margin-bottom: 8px;">Ruxsat Berilmadi</h2>
      <p style="color: var(--text-muted); font-size: 0.9rem;">
        Sizning Telegram hisobingiz ushbu bo'limga kirish huquqiga ega emas. Faqat belgilangan administratorlar kirishi mumkin.
      </p>
    </div>

    <!-- Admin Content Area -->
    <div id="admin-content" class="hidden">
      <div id="admin-toast" class="card hidden" style="margin-bottom: 14px; font-weight: 500; font-size: 0.9rem;"></div>

      <!-- Two Primary Horizontal Admin Navigation Buttons (1 on top, 2 directly below it) -->
      <div class="admin-nav-cards">
        <button id="admin-btn-library" class="admin-nav-card active" onclick="switchAdminSection('library')">
          <div class="admin-nav-left">
            <span class="admin-nav-icon">🎵</span>
            <div>
              <div class="admin-nav-title">Musiqalar Kutubxonasi</div>
              <div class="admin-nav-desc">4 ta toifa, fon musiqalari va ohanglar</div>
            </div>
          </div>
          <span class="admin-nav-arrow">➔</span>
        </button>

        <button id="admin-btn-users" class="admin-nav-card" onclick="switchAdminSection('users')">
          <div class="admin-nav-left">
            <span class="admin-nav-icon">👥</span>
            <div>
              <div class="admin-nav-title">Foydalanuvchilar Boshqaruvi</div>
              <div class="admin-nav-desc">Bot foydalanuvchilari, urinishlar va buyurtmalar</div>
            </div>
          </div>
          <span class="admin-nav-arrow">➔</span>
        </button>
      </div>

      <!-- SECTION 1: Musiqalar Kutubxonasi -->
      <div id="section-library">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
          <h3 style="font-size: 1.1rem; font-weight: 600;">4 Ta Musiqa Toifasi</h3>
          <button onclick="loadCategories()" class="btn-sm btn-secondary" style="width: auto;">🔄 Yangilash</button>
        </div>

        <div id="categories-container">
          <!-- Rendered by JS -->
        </div>
      </div>

      <!-- SECTION 2: Foydalanuvchilar Boshqaruvi -->
      <div id="section-users" class="hidden">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px;">
          <div>
            <h3 style="font-size: 1.1rem; font-weight: 600;">Foydalanuvchilar Ro'yxati</h3>
            <div id="users-count-label" style="font-size: 0.78rem; color: var(--text-muted); margin-top: 2px;">Yuklanmoqda...</div>
          </div>
          <button onclick="loadUsers()" class="btn-sm btn-secondary" style="width: auto;">🔄 Yangilash</button>
        </div>

        <!-- Search Bar with Search Icon -->
        <div class="user-search-wrapper">
          <span class="user-search-icon">🔍</span>
          <input 
            type="text" 
            id="user-search-input" 
            class="user-search-input" 
            placeholder="Ism, @username yoki Telegram ID bo'yicha qidirish..." 
            oninput="handleUserSearch(event)"
          />
          <button id="btn-clear-search" class="user-search-clear hidden" onclick="clearUserSearch()">✕</button>
        </div>

        <div id="users-list-container">
          <!-- Rendered by JS -->
        </div>
      </div>
    </div>
  </main>

  <!-- Upload Modal / Input Hidden -->
  <input type="file" id="admin-file-input" accept="audio/*,.mp3,.wav,.m4a,.ogg" style="display: none;" onchange="handleFileSelected(event)">

  <script>
    const tg = window.Telegram?.WebApp;
    let selectedCategoryId = null;
    let token = sessionStorage.getItem("vivern_token");
    let allUsersCache = [];
    let searchDebounceTimer = null;

    async function initAdmin() {
      if (tg) {
        tg.ready();
        tg.expand();
      }

      // Check authorization with backend
      const rawInitData = tg?.initData || "test_user_8449563084";
      try {
        const authRes = await fetch("/api/auth/telegram", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ init_data: rawInitData })
        });
        if (!authRes.ok) throw new Error("Auth failed");
        const authData = await authRes.json();
        token = authData.token;
        sessionStorage.setItem("vivern_token", token);

        if (!authData.user.is_admin) {
          document.getElementById("unauthorized-card").classList.remove("hidden");
          return;
        }

        document.getElementById("admin-content").classList.remove("hidden");
        loadCategories();
      } catch (e) {
        document.getElementById("unauthorized-card").classList.remove("hidden");
      }
    }

    // Switch between Musiqalar Kutubxonasi and Foydalanuvchilar Boshqaruvi
    function switchAdminSection(section) {
      const btnLib = document.getElementById("admin-btn-library");
      const btnUsers = document.getElementById("admin-btn-users");
      const secLib = document.getElementById("section-library");
      const secUsers = document.getElementById("section-users");

      if (section === "library") {
        btnLib.classList.add("active");
        btnUsers.classList.remove("active");
        secLib.classList.remove("hidden");
        secUsers.classList.add("hidden");
        loadCategories();
      } else {
        btnUsers.classList.add("active");
        btnLib.classList.remove("active");
        secUsers.classList.remove("hidden");
        secLib.classList.add("hidden");
        loadUsers();
      }
    }

    /* -------------------------------------------------------------
       SECTION 1: Musiqalar Kutubxonasi Functions
       ------------------------------------------------------------- */
    async function loadCategories() {
      const container = document.getElementById("categories-container");
      container.innerHTML = '<div style="text-align:center; padding: 25px;"><div class="spinner"></div><div style="font-size:0.8rem; color:var(--text-muted); margin-top:8px;">Kutubxona yuklanmoqda...</div></div>';

      try {
        const res = await fetch("/api/admin/categories", {
          headers: { "Authorization": `Bearer ${token}` }
        });
        if (!res.ok) throw new Error("Yuklab bo'lmadi");
        const categories = await res.json();

        container.innerHTML = "";
        for (const cat of categories) {
          const card = document.createElement("div");
          card.className = "category-card";

          const activeTrack = cat.active_track;
          let trackHtml = '<div style="font-size: 0.85rem; color: var(--text-muted); margin-top: 8px;">Faol trek mavjud emas.</div>';

          if (activeTrack) {
            trackHtml = `
              <div class="track-item track-active">
                <div class="track-meta">
                  <span style="font-weight: 600;">${activeTrack.title}</span>
                  <span class="badge-active">FAOL (v${activeTrack.version})</span>
                </div>
                <div style="font-size: 0.78rem; color: var(--text-muted);">
                  Format: ${activeTrack.format.toUpperCase()} | Davomiyligi: ${activeTrack.duration_seconds}s
                </div>
                <audio controls src="/api/admin/assets/${activeTrack.id}/preview" preload="none"></audio>
              </div>
            `;
          }

          card.innerHTML = `
            <div style="display: flex; justify-content: space-between; align-items: center;">
              <div>
                <div style="font-weight: 700; font-size: 0.95rem;">${cat.name}</div>
                <div style="font-size: 0.75rem; color: var(--text-muted);">ID: ${cat.id}</div>
              </div>
              <button onclick="triggerUpload('${cat.id}')" class="btn-sm btn-primary" style="width: auto;">
                ➕ Yangi Trek
              </button>
            </div>
            ${trackHtml}
            <div style="margin-top: 10px;">
              <button onclick="toggleTrackList('${cat.id}')" class="btn-sm btn-secondary" style="width: 100%;">
                Barcha versiyalarni ko'rish
              </button>
              <div id="list-${cat.id}" class="hidden" style="margin-top: 8px;"></div>
            </div>
          `;
          container.appendChild(card);
        }
      } catch (err) {
        container.innerHTML = `<div style="color:var(--danger-color); padding:10px;">Xatolik: ${err.message}</div>`;
      }
    }

    async function toggleTrackList(categoryId) {
      const listEl = document.getElementById(`list-${categoryId}`);
      if (!listEl.classList.contains("hidden")) {
        listEl.classList.add("hidden");
        return;
      }
      listEl.innerHTML = '<div style="font-size:0.8rem; color:var(--text-muted);">Yuklanmoqda...</div>';
      listEl.classList.remove("hidden");

      try {
        const res = await fetch(`/api/admin/assets?category=${categoryId}`, {
          headers: { "Authorization": `Bearer ${token}` }
        });
        const tracks = await res.json();
        if (tracks.length === 0) {
          listEl.innerHTML = '<div style="font-size:0.8rem; color:var(--text-muted);">Hech qanday trek yo\'q.</div>';
          return;
        }

        listEl.innerHTML = tracks.map(t => `
          <div class="track-item ${t.is_active ? 'track-active' : ''}">
            <div class="track-meta">
              <span>${t.title}</span>
              ${t.is_active ? '<span class="badge-active">FAOL</span>' : '<span class="badge-inactive">No-faol</span>'}
            </div>
            <audio controls src="/api/admin/assets/${t.id}/preview" preload="none"></audio>
            <div class="action-btn-row">
              ${!t.is_active ? `<button onclick="activateTrack('${t.id}')" class="btn-sm btn-activate">Faollashtirish</button>` : ''}
              <button onclick="deleteTrack('${t.id}')" class="btn-sm btn-delete">O'chirish</button>
            </div>
          </div>
        `).join("");
      } catch (e) {
        listEl.innerHTML = '<div style="color:var(--danger-color); font-size:0.8rem;">Yuklab bo\'lmadi.</div>';
      }
    }

    function showAdminNotification(msg, type = "info") {
      const toast = document.getElementById("admin-toast");
      if (!toast) return;
      toast.className = "card";
      if (type === "success") {
        toast.style.background = "rgba(16, 185, 129, 0.15)";
        toast.style.borderColor = "var(--accent-emerald)";
        toast.style.color = "#6ee7b7";
      } else if (type === "error") {
        toast.style.background = "rgba(239, 68, 68, 0.15)";
        toast.style.borderColor = "var(--danger-color)";
        toast.style.color = "#fca5a5";
      } else {
        toast.style.background = "rgba(59, 130, 246, 0.15)";
        toast.style.borderColor = "var(--accent-blue)";
        toast.style.color = "#93c5fd";
      }
      toast.innerHTML = msg;
      toast.classList.remove("hidden");
      if (type !== "loading") {
        setTimeout(() => toast.classList.add("hidden"), 4000);
      }
    }

    function triggerUpload(categoryId) {
      selectedCategoryId = categoryId;
      document.getElementById("admin-file-input").click();
    }

    async function handleFileSelected(event) {
      const file = event.target.files[0];
      if (!file || !selectedCategoryId) return;

      const title = file.name.replace(/\.[^/.]+$/, "");
      const formData = new FormData();
      formData.append("file", file);
      formData.append("category", selectedCategoryId);
      formData.append("title", title);
      formData.append("set_active", "true");

      showAdminNotification("⏳ Fayl yuklanmoqda va tekshirilmoqda...", "loading");
      try {
        const res = await fetch("/api/admin/assets/upload", {
          method: "POST",
          headers: { "Authorization": `Bearer ${token}` },
          body: formData
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || "Yuklashda xatolik");
        showAdminNotification("✅ Trek muvaffaqiyatli saqlandi va faollashtirildi!", "success");
        loadCategories();
      } catch (err) {
        showAdminNotification("❌ Xatolik: " + err.message, "error");
      } finally {
        event.target.value = "";
      }
    }

    async function activateTrack(assetId) {
      try {
        const res = await fetch(`/api/admin/assets/${assetId}/activate`, {
          method: "PATCH",
          headers: { "Authorization": `Bearer ${token}` }
        });
        if (!res.ok) throw new Error("Faollashtirib bo'lmadi");
        loadCategories();
      } catch (err) {
        alert(err.message);
      }
    }

    async function deleteTrack(assetId) {
      if (!confirm("Haqiqatan ham bu trekni o'chirmoqchimisiz?")) return;
      try {
        const res = await fetch(`/api/admin/assets/${assetId}`, {
          method: "DELETE",
          headers: { "Authorization": `Bearer ${token}` }
        });
        if (!res.ok) throw new Error("O'chirib bo'lmadi");
        loadCategories();
      } catch (err) {
        alert(err.message);
      }
    }

    /* -------------------------------------------------------------
       SECTION 2: Foydalanuvchilar Boshqaruvi Functions
       ------------------------------------------------------------- */
    async function loadUsers(searchQuery = "") {
      const container = document.getElementById("users-list-container");
      const countLabel = document.getElementById("users-count-label");
      container.innerHTML = '<div style="text-align:center; padding: 25px;"><div class="spinner"></div><div style="font-size:0.8rem; color:var(--text-muted); margin-top:8px;">Foydalanuvchilar yuklanmoqda...</div></div>';

      try {
        let url = "/api/admin/users";
        if (searchQuery.trim()) {
          url += `?query=${encodeURIComponent(searchQuery.trim())}`;
        }
        const res = await fetch(url, {
          headers: { "Authorization": `Bearer ${token}` }
        });
        if (!res.ok) throw new Error("Foydalanuvchilarni yuklab bo'lmadi");
        const users = await res.json();
        allUsersCache = users;

        countLabel.textContent = `Jami: ${users.length} ta foydalanuvchi topildi`;
        renderUsersList(users);
      } catch (err) {
        container.innerHTML = `<div style="color:var(--danger-color); padding:10px;">Xatolik: ${err.message}</div>`;
      }
    }

    function renderUsersList(users) {
      const container = document.getElementById("users-list-container");
      if (!users || users.length === 0) {
        container.innerHTML = `
          <div style="text-align: center; padding: 35px 20px; color: var(--text-muted);">
            <div style="font-size: 2.2rem; margin-bottom: 8px;">🔍</div>
            <div style="font-weight: 600;">Hech qanday foydalanuvchi topilmadi</div>
            <div style="font-size: 0.8rem; margin-top: 4px;">Qidiruv so'zini o'zgartirib ko'ring</div>
          </div>
        `;
        return;
      }

      container.innerHTML = users.map(u => {
        const fullName = `${u.first_name || ""} ${u.last_name || ""}`.trim() || "Noma'lum foydalanuvchi";
        const initial = (u.first_name || u.username || "U")[0].toUpperCase();
        const usernameDisplay = u.username ? `@${u.username}` : "<span style='color:var(--text-muted)'>username yo'q</span>";
        
        // Trial calculation out of 3
        const used = u.trial_count || 0;
        const remaining = Math.max(0, 3 - used);
        let trialBadge = `<span style="color:var(--accent-emerald); font-weight:700;">${remaining} ta bepul qoldi</span> (${used}/3 ishlatilgan)`;
        if (remaining === 0) {
          trialBadge = `<span style="color:var(--danger-color); font-weight:700;">Tugagan</span> (${used} ta ishlatilgan)`;
        }

        const roleBadge = u.is_admin 
          ? `<span style="background:var(--accent-gold); color:#78350f; font-size:0.7rem; font-weight:700; padding:2px 8px; border-radius:8px;">ADMIN</span>`
          : `<span style="background:rgba(255,255,255,0.08); color:var(--text-muted); font-size:0.7rem; padding:2px 8px; border-radius:8px;">FOYDALANUVCHI</span>`;

        return `
          <div class="user-card">
            <div class="user-card-top">
              <div class="user-profile-header">
                <div class="user-avatar">${initial}</div>
                <div>
                  <div style="font-weight: 700; font-size: 0.98rem;">${fullName}</div>
                  <div style="font-size: 0.82rem; margin-top: 1px;">${usernameDisplay}</div>
                  <div style="font-size: 0.72rem; color: var(--text-muted); margin-top: 2px;">ID: <code>${u.id}</code></div>
                </div>
              </div>
              <div>${roleBadge}</div>
            </div>

            <div class="user-meta-grid">
              <div class="user-meta-cell">
                <span class="user-meta-label">💳 Bepul Urinishlar</span>
                <span class="user-meta-val" style="font-size:0.8rem;">${trialBadge}</span>
              </div>
              <div class="user-meta-cell">
                <span class="user-meta-label">📦 Buyurtmalari</span>
                <span class="user-meta-val">Jami: ${u.total_orders} ta (${u.completed_orders} tayyor)</span>
              </div>
              <div class="user-meta-cell">
                <span class="user-meta-label">📅 Qo'shilgan sana</span>
                <span class="user-meta-val" style="font-size:0.78rem; font-weight:500;">${u.created_at || "Noma'lum"}</span>
              </div>
              <div class="user-meta-cell">
                <span class="user-meta-label">🌐 Til sozlamasi</span>
                <span class="user-meta-val" style="font-size:0.78rem; text-transform:uppercase;">${u.language_code || "UZ"}</span>
              </div>
            </div>

            <div style="display:flex; justify-content:flex-end; gap:8px; margin-top:2px;">
              <button onclick="resetUserTrials(${u.id}, '${fullName.replace(/'/g, "\\'")}')" class="btn-sm btn-secondary" style="font-size:0.76rem; padding:6px 10px;">
                🔄 3 ta bepul urinish berish
              </button>
            </div>
          </div>
        `;
      }).join("");
    }

    function handleUserSearch(event) {
      const q = event.target.value;
      const clearBtn = document.getElementById("btn-clear-search");
      if (q.trim()) {
        clearBtn.classList.remove("hidden");
      } else {
        clearBtn.classList.add("hidden");
      }

      clearTimeout(searchDebounceTimer);
      searchDebounceTimer = setTimeout(() => {
        loadUsers(q);
      }, 250);
    }

    function clearUserSearch() {
      const input = document.getElementById("user-search-input");
      input.value = "";
      document.getElementById("btn-clear-search").classList.add("hidden");
      loadUsers("");
    }

    async function resetUserTrials(userId, userName) {
      if (!confirm(`${userName} uchun bepul urinishlar sonini qaytadan 3 taga yangilamoqchimisiz?`)) return;

      try {
        const res = await fetch(`/api/admin/users/${userId}/reset-trials`, {
          method: "PATCH",
          headers: { "Authorization": `Bearer ${token}` }
        });
        if (!res.ok) throw new Error("Urinishlarni yangilab bo'lmadi");
        showAdminNotification(`✅ ${userName} uchun 3 ta bepul urinish berildi!`, "success");
        loadUsers(document.getElementById("user-search-input").value);
      } catch (err) {
        showAdminNotification("❌ Xatolik: " + err.message, "error");
      }
    }

    document.addEventListener("DOMContentLoaded", initAdmin);
  </script>
</body>
</html>
